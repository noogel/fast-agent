name: Publish Fast Agent tutorial

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/fast_agent/**'
      - 'examples/**'
      - 'scripts/docs_hooks.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/fast-agent-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-agent-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'noogel/fast-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tutorial
        id: deployment
        uses: actions/deploy-pages@v4
