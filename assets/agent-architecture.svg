<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Fast Agent 分层逻辑架构</title>
<desc id="desc">六个横向层级：交互接入、任务编排、上下文知识、能力适配、执行环境、存储基础设施。右侧为贯穿各层的安全与可观测性。外部模型和 MCP 服务位于系统边界之外。方框表达组成关系，不表达时间顺序。</desc>
